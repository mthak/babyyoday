# LoRA fine-tuning config for Llama-3-8B-Instruct
# Runs on: machine with 16GB+ RAM or GPU
# Train time: ~1h on A10G GPU, ~5h on CPU

base_model: "meta-llama/Meta-Llama-3-8B-Instruct"
model_family: "llama3"

training_data: "./data/training_data.jsonl"
output_dir:    "./models/llama3_lora_adapter/"

quantization:
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  bias: "none"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  weight_decay: 0.001
  max_grad_norm: 0.3
  warmup_ratio: 0.03
  lr_scheduler: "cosine"
  max_seq_length: 1024
  packing: false
  val_split: 0.1
  logging_steps: 10
  save_steps: 50
  eval_steps: 50
